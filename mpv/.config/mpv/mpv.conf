# --------------------------------------------------
# Playback
# --------------------------------------------------
input-default-bindings = no
save-position-on-quit = yes
hwdec = auto

# --------------------------------------------------
# UI — terminal-minimal (Catppuccin Mocha + JetBrains Mono)
# Matches Ghostty / yazi; keyboard-first, no mouse chrome.
# --------------------------------------------------
osc = no
osd-level = 2
osd-duration = 1500
osd-fractions = yes
osd-on-seek = bar
osd-scale-by-window = no
osd-align-x = center
osd-align-y = bottom

osd-font = JetBrainsMono Nerd Font
osd-font-size = 22
osd-bold = no
osd-color = "#FFcdd6f4"
osd-back-color = "#CC181825"
osd-outline-color = "#FF313244"
osd-outline-size = 0
osd-border-style = background-box
osd-margin-x = 16
osd-margin-y = 8

# Bottom progress line — align-y: 1 = bottom (-1 = top)
osd-bar = yes
osd-bar-w = 98
osd-bar-h = 0.35
osd-bar-align-x = 0
osd-bar-align-y = 1
osd-bar-outline-size = 0
osd-bar-marker-style = none
osd-selected-color = "#FF89b4fa"
osd-selected-outline-color = "#00181825"

osd-playing-msg = "${filename/no-ext}"
osd-playing-msg-duration = 900

cursor-autohide = always

title = ${filename}
title-bar = no

# Subtitles
sub-font = JetBrainsMono Nerd Font
sub-font-size = 26
sub-color = "#FFcdd6f4"
sub-border-color = "#E0181825"
sub-back-color = "#991e1e2e"
sub-border-size = 2.5
sub-shadow-offset = 0
sub-margin-y = 32

# macOS (when title bar is visible in other contexts)
macos-title-bar-appearance = darkAqua
macos-title-bar-color = "#F21e1e2e"

# --------------------------------------------------
# yazi — centered floating window, sized to video aspect ratio
# autofit-larger must use WxH (e.g. 85%x85%): a single "85%" only caps width,
# so portrait videos can still overflow the screen height.
# --------------------------------------------------
[play]
force-window = immediate
keepaspect-window = yes
geometry = 50%:50%
autofit-larger = 85%x85%
autofit-smaller = 0
border = no
ontop = no
focus-on = open
keep-open = no

[preview]
profile = play
autofit-larger = 55%x55%
