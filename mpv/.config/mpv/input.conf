# vim-style seek
h           seek -5
l           seek  5
j           seek -15
k           seek  15
H           seek -60
L           seek  60
LEFT        seek -5
RIGHT       seek  5
UP          seek  60
DOWN        seek -60

# playback
SPACE       cycle pause
q           quit
f           cycle fullscreen
m           cycle mute
9           add volume -2
0           add volume  2
<           script-binding yazi_sync/prev
>           script-binding yazi_sync/next
,           frame-back-step
.           frame-step

# osd toggles (script id = toggle_osd, from toggle-osd.lua)
o           script-binding toggle_osd/toggle-media-info
O           script-binding toggle_osd/toggle-stats

# block mpv defaults that cause conflicts
/           ignore
*           ignore
i           ignore
I           ignore
?           ignore
g           ignore
