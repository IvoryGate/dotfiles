"$schema" = 'https://starship.rs/config-schema.json'

# Bracketed Segments — https://starship.rs/zh-CN/presets/bracketed-segments

format = """
$os\
 $username\
 $directory\
 $git_branch\
 $git_status\
 $c\
 $cpp\
 $rust\
 $golang\
 $nodejs\
 $bun\
 $php\
 $java\
 $kotlin\
 $haskell\
 $python\
 ${custom.uv}\
 $docker_context\
 $conda\
 $pixi\
 $time\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo  = '#f2cdcd'
pink      = '#f5c2e7'
mauve     = '#cba6f7'
red       = '#f38ba8'
maroon    = '#eba0ac'
peach     = '#fab387'
yellow    = '#f9e2af'
green     = '#a6e3a1'
teal      = '#94e2d5'
sky       = '#89dceb'
sapphire  = '#74c7ec'
blue      = '#89b4fa'
lavender  = '#b4befe'
text      = '#cdd6f4'
subtext1  = '#bac2de'
subtext0  = '#a6adc8'
overlay2  = '#9399b2'
overlay1  = '#7f849c'
overlay0  = '#6c7086'
surface2  = '#585b70'
surface1  = '#45475a'
surface0  = '#313244'
mantle    = '#181825'
crust     = '#11111b'

[os]
disabled = false
style = "bold blue"
format = '\[[$symbol]($style)\]'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bold peach"
style_root = "bold red"
format = '\[[$user]($style)\]'

[directory]
style = "bold blue"
format = '\[[$path]($style)\]'
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bold teal"
format = '\[[$symbol$branch]($style)\]'

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style))'

[c]
symbol = " "
style = "bold sapphire"
format = '\[[$symbol($version(-$name))]($style)\]'

[cpp]
symbol = " "
style = "bold sapphire"
format = '\[[$symbol($version(-$name))]($style)\]'

[rust]
symbol = ""
style = "bold peach"
format = '\[[$symbol($version)]($style)\]'

[golang]
symbol = ""
style = "bold sky"
format = '\[[$symbol($version)]($style)\]'

[nodejs]
symbol = ""
style = "bold green"
format = '\[[$symbol($version)]($style)\]'

[bun]
symbol = ""
style = "bold green"
format = '\[[$symbol($version)]($style)\]'

[php]
symbol = ""
style = "bold lavender"
format = '\[[$symbol($version)]($style)\]'

[java]
symbol = ""
style = "bold red"
format = '\[[$symbol($version)]($style)\]'

[kotlin]
symbol = ""
style = "bold mauve"
format = '\[[$symbol($version)]($style)\]'

[haskell]
symbol = ""
style = "bold blue"
format = '\[[$symbol($version)]($style)\]'

[python]
symbol = ""
style = "bold green"
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
detect_files = [
  ".python-version",
  "Pipfile",
  "__init__.py",
  "pylock.toml",
  "pyproject.toml",
  "requirements.txt",
  "setup.py",
  "tox.ini",
  "uv.lock",
]
python_binary = [
  ".venv/bin/python",
  ["uv", "run", "--no-python-downloads", "python"],
  "python3",
]

[custom.uv]
description = "uv version in uv-managed Python projects"
command = "uv --version 2>/dev/null | awk '{print $2}'"
when = "command -v uv >/dev/null 2>&1"
detect_files = ["pyproject.toml", "uv.lock"]
detect_folders = [".venv"]
symbol = "󰠅 "
style = "bold green"
format = '\[[$symbol($output)]($style)\]'

[docker_context]
symbol = ""
style = "bold blue"
format = '\[[$symbol$context]($style)\]'

[conda]
style = "bold green"
format = '\[[$symbol$environment]($style)\]'

[pixi]
style = "bold green"
format = '\[[$symbol$version( $environment)]($style)\]'

[time]
disabled = false
time_format = "%R"
style = "subtext0"
format = '\[[ $time]($style)\]'

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_visual_symbol = "[❮](bold yellow)"
