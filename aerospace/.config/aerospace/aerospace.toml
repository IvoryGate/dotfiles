
# docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
start-at-login = true

after-startup-command = [
    'exec-and-forget sh -c "~/.config/borders/bordersrc"',
    'exec-and-forget sketchybar',
]

exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# layout
accordion-padding = 30
default-root-container-layout = 'tiles'       # tiles | accordion
default-root-container-orientation = 'auto'   # horizontal | vertical | auto

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = []

on-mode-changed = []

[key-mapping]
    preset = 'qwerty'   # qwerty | dvorak | colemak

[gaps]
    inner.horizontal = 8
    inner.vertical = 8
    outer.left = 4
    outer.bottom = 4
    # Leave room for sketchybar (height 32); tune per monitor if needed
    outer.top = [{ monitor."built-in" = 10 }, 40]
    outer.right = 4

[mode.main.binding]
    alt-ctrl-shift-slash = 'layout tiles horizontal vertical'
    alt-ctrl-shift-comma = 'layout accordion horizontal vertical'

    alt-ctrl-shift-f = 'fullscreen'

    cmd-alt-ctrl-shift-h = 'focus left'
    cmd-alt-ctrl-shift-j = 'focus down'
    cmd-alt-ctrl-shift-k = 'focus up'
    cmd-alt-ctrl-shift-l = 'focus right'

    alt-ctrl-shift-a = 'move left'
    alt-ctrl-shift-s = 'move down'
    alt-ctrl-shift-w = 'move up'
    alt-ctrl-shift-d = 'move right'

    alt-ctrl-shift-minus = 'resize smart -50'
    alt-ctrl-shift-equal = 'resize smart +50'

    # Hyper (ctrl+alt+shift) — same as Karabiner in terminals; script handles single vs dual display
    alt-ctrl-shift-1 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 1'
    alt-ctrl-shift-2 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 2'
    alt-ctrl-shift-3 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 3'
    alt-ctrl-shift-4 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 4'
    alt-ctrl-shift-5 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 5'
    alt-ctrl-shift-6 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 6'
    alt-ctrl-shift-7 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 7'
    alt-ctrl-shift-8 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 8'
    alt-ctrl-shift-9 = 'exec-and-forget bash ~/.config/aerospace/workspace-key.sh 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    alt-ctrl-shift-tab = 'workspace-back-and-forth'
    cmd-alt-ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-ctrl-shift-semicolon = 'mode service'

    alt-ctrl-shift-leftSquareBracket = 'focus dfs-prev --boundaries-action wrap-around-the-workspace'
    alt-ctrl-shift-rightSquareBracket = 'focus dfs-next --boundaries-action wrap-around-the-workspace'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Homebrew mpv reports app name "mpv" (no bundle id) — float or it tiles to ~0px.
[[on-window-detected]]
if.app-name-regex-substring = 'mpv'
run = 'layout floating'